name: AI Photo Editor checks

on:
  push:
    paths:
      - 'photo-editor/**'
      - '.github/workflows/photo-editor.yml'
  pull_request:
    paths:
      - 'photo-editor/**'
      - '.github/workflows/photo-editor.yml'

jobs:
  proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: photo-editor/proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: photo-editor/proxy/package.json
      - run: npm install
      - run: npm run check

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: photo-editor/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Flutter's generated platform projects are deliberately not committed here.
      - run: flutter create --platforms=android .
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
