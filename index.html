<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>GitHub Models Chat</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#15191f;--panel2:#1c222a;--line:#2b323c;--text:#f4f6f8;--muted:#9da7b3;--blue:#2f81f7;--red:#f85149}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}header{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}h1{font-size:18px;margin:0 0 10px}.settings{display:flex;gap:8px;flex-wrap:wrap}.settings input,.settings select,.settings button{min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:9px 11px;color:var(--text)}.settings input{flex:1;min-width:180px}.settings select{flex:1;min-width:220px}.settings button,.send{background:var(--blue);border:0;font-weight:700}.toggle{background:transparent!important;border:1px solid var(--line)!important}.hidden{display:none}.banner{background:#3a1718;color:#ffb4b0;border-bottom:1px solid #74302c;padding:10px 14px;font-size:14px}
#chat{flex:1;overflow:auto;padding:16px 12px 105px}.msg{display:flex;margin:0 auto 14px;max-width:850px}.bubble{max-width:88%;padding:11px 13px;border-radius:16px;line-height:1.5;overflow-wrap:anywhere}.user{justify-content:flex-end}.user .bubble{background:#1f4f91;border-bottom-right-radius:5px}.assistant .bubble{background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:5px}.bubble pre{background:#0d1117;padding:12px;border-radius:9px;overflow:auto}.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.composer{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 20%)}form{max-width:850px;margin:auto;display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:7px}textarea{flex:1;min-height:48px;max-height:130px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:12px}.send{width:54px;min-height:48px;border-radius:10px;color:white}.empty{text-align:center;color:var(--muted);padding:18vh 20px}.empty b{color:var(--text)}
@media(min-width:700px){header{padding-left:max(14px,calc((100vw - 850px)/2));padding-right:max(14px,calc((100vw - 850px)/2))}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>◈ GitHub Models Chat <button id="toggle" class="toggle" style="float:right;padding:7px 10px">⚙ Settings</button></h1>
<div id="settings" class="settings hidden">
<input id="token" type="password" autocomplete="off" placeholder="GitHub PAT (models:read)">
<select id="model"><option>openai/gpt-4o-mini</option><option>openai/gpt-4o</option><option>meta/Llama-4-Maverick-17B-128E-Instruct</option><option>deepseek/DeepSeek-R1</option></select>
<button id="save">Save</button>
</div>
</header>
<div id="banner" class="banner hidden"></div>
<main id="chat"><div class="empty"><b>Start chatting</b><br>Open Settings, add your GitHub PAT, choose a model, and send a message.</div></main>
<div class="composer"><form id="form"><textarea id="input" rows="1" placeholder="Message…"></textarea><button class="send" id="send">Send</button></form></div>
</div>
<script>
const API="https://models.github.ai/inference/chat/completions",SKEY="ghModelsSettings",HKEY="ghModelsHistory";
const defaults={token:"",model:"openai/gpt-4o-mini"};let s={...defaults,...JSON.parse(localStorage.getItem(SKEY)||"{}")},history=JSON.parse(localStorage.getItem(HKEY)||"[]"),busy=false;
const $=id=>document.getElementById(id);function banner(t){$("banner").textContent=t;$("banner").classList.toggle("hidden",!t)}
function scroll(){const c=$("chat");c.scrollTop=c.scrollHeight}function save(){localStorage.setItem(SKEY,JSON.stringify(s))}
function bubble(role,text){const row=document.createElement("div");row.className="msg "+role;const b=document.createElement("div");b.className="bubble";b.innerHTML=role==="assistant"?marked.parse(text):"";if(role==="user")b.textContent=text;row.appendChild(b);$("chat").appendChild(row);scroll();return b}
function render(){const c=$("chat");c.innerHTML="";if(!history.length){c.innerHTML='<div class="empty"><b>Start chatting</b><br>Send a message to begin.</div>';return}history.forEach(m=>bubble(m.role,m.content))}
function friendly(status){if(status===401||status===403)return"Invalid token or insufficient permission. Check your GitHub PAT and models:read access.";if(status===429)return"Rate limit reached. Please wait and try again.";return"GitHub Models returned an error ("+status+")."}
async function send(text){if(busy)return;if(!s.token){$("settings").classList.remove("hidden");banner("GitHub PAT is missing. Add it in Settings.");return}busy=true;$("send").disabled=true;banner("");history.push({role:"user",content:text});bubble("user",text);const b=bubble("assistant","");let full="";
try{const r=await fetch(API,{method:"POST",headers:{Authorization:"Bearer "+s.token,"Content-Type":"application/json"},body:JSON.stringify({model:s.model,messages:[{role:"system",content:"You are a helpful assistant."},...history],stream:true})});
if(!r.ok)throw Object.assign(new Error(),{status:r.status});if(!r.body)throw new Error("stream");
const reader=r.body.getReader(),dec=new TextDecoder();let buf="";
while(true){const {value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let lines=buf.split("\n");buf=lines.pop()||"";for(const line of lines){const x=line.trim();if(!x.startsWith("data:"))continue;const d=x.slice(5).trim();if(d==="[DONE]")continue;try{const j=JSON.parse(d),delta=j.choices?.[0]?.delta?.content||"";if(delta){full+=delta;b.innerHTML=marked.parse(full);scroll()}}catch(e){}}}
history.push({role:"assistant",content:full||"No response received."});localStorage.setItem(HKEY,JSON.stringify(history));
}catch(e){history.pop();b.remove();banner(e.status?friendly(e.status):"Network failure. Check your internet connection and try again.");localStorage.setItem(HKEY,JSON.stringify(history))}
finally{busy=false;$("send").disabled=false}}
$("toggle").onclick=()=>$("settings").classList.toggle("hidden");$("save").onclick=()=>{s.token=$("token").value.trim();s.model=$("model").value;save();$("settings").classList.add("hidden");banner("")};
$("token").value=s.token;$("model").value=s.model;render();$("form").onsubmit=e=>{e.preventDefault();const v=$("input").value.trim();if(!v)return;$("input").value="";send(v)};$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}});
</script>
</body>
</html>
